<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeFit Marmitas - Links</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #15803d 0%, #166534 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .logo-container {
            width: 140px;
            height: 140px;
            margin: 0 auto 20px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(34, 197, 94, 0.3);
            overflow: hidden;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-size: 32px;
            color: #1f2937;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .tagline {
            color: #22c55e;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #6b7280;
            font-size: 13px;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: white;
        }

        .link-btn:active {
            transform: scale(0.98);
        }

        .whatsapp {
            background: #25D366;
        }

        .whatsapp:hover {
            background: #20BA58;
        }

        .instagram {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
        }

        .instagram:hover {
            opacity: 0.9;
        }

        .facebook {
            background: #1877F2;
        }

        .facebook:hover {
            background: #1560E0;
        }

        .email {
            background: #EA4335;
        }

        .email:hover {
            background: #D33425;
        }

        .icon {
            font-size: 20px;
        }

        .footer {
            border-top: 1px solid #e5e7eb;
            padding-top: 20px;
            margin-top: 20px;
        }

        .benefits {
            display: flex;
            justify-content: space-around;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .benefit-badge {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            color: #6b7280;
        }

        .benefit-icon {
            font-size: 20px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 26px;
            }

            .link-btn {
                padding: 14px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <img src="logo.png" alt="LeFit Logo">
        </div>
        
        <h1>LeFit</h1>
        <div class="tagline">Leveza e Sabor</div>
        <p class="subtitle">Nutricionista Geovana Mattoso</p>
		<p class="subtitle">Faça aqui seu pedido 👇</p>

        <div class="links">
            <a href="https://wa.me/5516996098065?text=Olá%20LeFit!%20Gostaria%20de%20informações%20sobre%20as%20marmitas" 
               class="link-btn whatsapp"
               onclick="return !window.open(this.href, '_blank');">
                <span class="icon">💬</span>
                WhatsApp
            </a>

            <a href="https://www.instagram.com/lef_itmarmitas/" 
               class="link-btn instagram"
               target="_blank">
                <span class="icon">📷</span>
                Instagram
            </a>

            <a href="https://www.facebook.com/lefitmarmita" 
               class="link-btn facebook"
               target="_blank">
                <span class="icon">👍</span>
                Facebook
            </a>

            <a href="mailto:gege.mattoso@hotmail.com" 
               class="link-btn email">
                <span class="icon">📧</span>
                Email
            </a>
        </div>

        <div class="footer">
            <div class="benefits">
                <div class="benefit-badge">
                    <span class="benefit-icon">💪</span>
                    <span>Praticidade</span>
                </div>
                <div class="benefit-badge">
                    <span class="benefit-icon">⚖️</span>
                    <span>Equilíbrio</span>
                </div>
                <div class="benefit-badge">
                    <span class="benefit-icon">😊</span>
                    <span>Bem-estar</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
